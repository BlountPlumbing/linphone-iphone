name: Build state check (ASC)
on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: Bundle ID to check
        required: true
        default: net.blount.phone
      build_number:
        description: cfBundleVersion to look for (blank = report latest 10)
        required: false
        default: "55"
      asc_path:
        description: Raw ASC API path to GET instead (e.g. /v1/betaFeedbackCrashSubmissions?filter[app]=X)
        required: false
        default: ""
      publish_build:
        description: Attach this cfBundleVersion to all app beta groups + set What to Test
        required: false
        default: ""
      publish_notes:
        description: What to Test text for the publish
        required: false
        default: ""
jobs:
  check-build-state:
    name: Query ASC for uploaded build processing state
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install cryptography
        run: pip install cryptography
      - name: Mint JWT + query builds
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
          ASC_ISSUER: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
          ASC_P8_B64: ${{ secrets.APPSTORE_CONNECT_PRIVATE_KEY }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          ASC_PATH: ${{ inputs.asc_path }}
          PUBLISH_BUILD: ${{ inputs.publish_build }}
          PUBLISH_NOTES: ${{ inputs.publish_notes }}
        run: |
          python3 - <<'PY'
          import base64, json, os, time, urllib.request, urllib.error
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric.ec import ECDSA
          from cryptography.hazmat.primitives.asymmetric.utils import decode_dss_signature

          def b64u(b): return base64.urlsafe_b64encode(b).rstrip(b"=").decode()
          p8 = base64.b64decode(os.environ["ASC_P8_B64"])
          key = serialization.load_pem_private_key(p8, password=None)
          now = int(time.time())
          hdr = b64u(json.dumps({"alg":"ES256","kid":os.environ["ASC_KEY_ID"],"typ":"JWT"}).encode())
          pay = b64u(json.dumps({"iss":os.environ["ASC_ISSUER"],"iat":now,"exp":now+1200,"aud":"appstoreconnect-v1"}).encode())
          der = key.sign(f"{hdr}.{pay}".encode(), ECDSA(hashes.SHA256()))
          r,s = decode_dss_signature(der)
          tok = f"{hdr}.{pay}.{b64u(r.to_bytes(32,'big')+s.to_bytes(32,'big'))}"

          def get(path):
              req = urllib.request.Request("https://api.appstoreconnect.apple.com"+path,
                  headers={"Authorization":f"Bearer {tok}"})
              return json.loads(urllib.request.urlopen(req).read())

          def call(method, path, body=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request("https://api.appstoreconnect.apple.com"+path,
                  data=data, method=method,
                  headers={"Authorization":f"Bearer {tok}","Content-Type":"application/json"})
              try:
                  r = urllib.request.urlopen(req)
                  raw = r.read()
                  return r.status, (json.loads(raw) if raw.strip() else {})
              except urllib.error.HTTPError as e:
                  raw = e.read()
                  try: detail = json.loads(raw)
                  except Exception: detail = raw[:200]
                  return e.code, detail

          raw_path = os.environ.get("ASC_PATH","").strip()
          if raw_path:
              assert raw_path.startswith("/v1/"), "asc_path must start with /v1/"
              print(json.dumps(get(raw_path), indent=1)[:8000])
              raise SystemExit(0)

          pub = os.environ.get("PUBLISH_BUILD","").strip()
          if pub:
              bid = os.environ["BUNDLE_ID"]
              notes = os.environ.get("PUBLISH_NOTES","").strip() or f"Build {pub}"
              apps = get(f"/v1/apps?filter[bundleId]={bid}&fields[apps]=bundleId,name")
              app = next((a for a in apps.get("data",[]) if a["attributes"].get("bundleId")==bid), None)
              if not app: print("no exact-bundle app"); raise SystemExit(1)
              appid = app["id"]; print("APP", appid)
              bl = get(f"/v1/builds?filter[app]={appid}&filter[version]={pub}&limit=5")
              if not bl.get("data"): print("build not found", pub); raise SystemExit(1)
              b = bl["data"][0]; bvid = b["id"]
              print("BUILD", bvid, b["attributes"].get("version"), b["attributes"].get("processingState"))
              groups = get(f"/v1/betaGroups?filter[app]={appid}&limit=50")
              for g in groups.get("data",[]):
                  st, d = call("POST", f"/v1/betaGroups/{g['id']}/relationships/builds",
                               {"data":[{"type":"builds","id":bvid}]})
                  print("ATTACH", g["attributes"].get("name"), g["id"], "->", st)
              locs = get(f"/v1/builds/{bvid}/betaBuildLocalizations")
              en = next((l for l in locs.get("data",[]) if l["attributes"].get("locale")=="en-US"), None)
              if en:
                  st, d = call("PATCH", f"/v1/betaBuildLocalizations/{en['id']}",
                               {"data":{"type":"betaBuildLocalizations","id":en["id"],
                                "attributes":{"whatsNew":notes}}})
                  print("LOCALE en-US PATCH", st)
              else:
                  st, d = call("POST", "/v1/betaBuildLocalizations",
                               {"data":{"type":"betaBuildLocalizations",
                                "attributes":{"locale":"en-US","whatsNew":notes},
                                "relationships":{"build":{"data":{"type":"builds","id":bvid}}}}})
                  print("LOCALE en-US POST", st)
              raise SystemExit(0)

          bid = os.environ["BUNDLE_ID"]
          apps = get(f"/v1/apps?filter[bundleId]={bid}&fields[apps]=bundleId,name")
          if not apps.get("data"):
              print(f"NO APP for {bid}"); raise SystemExit(1)
          want = os.environ.get("BUILD_NUMBER","").strip()
          for app in apps["data"][:6]:
              aa = app["attributes"]
              print(f"APP {app['id']} {aa.get('name')} bundleId={aa.get('bundleId')}")
              builds = get(f"/v1/builds?filter[app]={app['id']}&sort=-uploadedDate&limit=12")
              found = False
              for b in builds.get("data",[]):
                  a = b["attributes"]
                  mark = " <== WANTED" if want and str(a.get("version"))==want else ""
                  if mark: found = True
                  print(f"  build {a.get('version')} state={a.get('processingState')} expired={a.get('expired')} uploaded={a.get('uploadedDate')}{mark}")
              if want and not found: print(f"  build {want} NOT in latest 12")
          PY
