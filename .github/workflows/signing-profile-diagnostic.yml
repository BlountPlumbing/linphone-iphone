name: Blount Phone signing profile diagnostic

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare installed profiles with branded targets
        env:
          PROFILE_MAIN: ${{ secrets.PROFILE_MAIN }}
          PROFILE_MSG: ${{ secrets.PROFILE_MSG }}
          PROFILE_EXT: ${{ secrets.PROFILE_EXT }}
          PROFILE_INTENTS: ${{ secrets.PROFILE_INTENTS }}
        run: |
          python3 - <<'PY'
          import base64, os, plistlib, subprocess, tempfile
          expected = {
              'PROFILE_MAIN': 'net.blount.phone',
              'PROFILE_MSG': 'net.blount.phone.msgNotificationService',
              'PROFILE_EXT': 'net.blount.phone.linphoneExtension',
              'PROFILE_INTENTS': 'net.blount.phone.intentsExtension',
          }
          for variable, bundle in expected.items():
              value = os.environ.get(variable, '')
              if not value:
                  raise SystemExit(f'{variable}: missing secret')
              with tempfile.NamedTemporaryFile(suffix='.mobileprovision') as profile:
                  profile.write(base64.b64decode(value))
                  profile.flush()
                  result = subprocess.run(['security', 'cms', '-D', '-i', profile.name], check=True, capture_output=True)
              data = plistlib.loads(result.stdout)
              ent = data['Entitlements']
              groups = ent.get('com.apple.security.application-groups', [])
              print(f'{variable}: name={data["Name"]!r} app={ent.get("application-identifier")!r} group_present={"group.net.blount.phone" in groups}')
              if data['Name'] != f'BlountDist {bundle}' or not ent.get('application-identifier', '').endswith('.' + bundle) or (variable != 'PROFILE_INTENTS' and 'group.net.blount.phone' not in groups):
                  raise SystemExit(f'{variable}: does not match target profile requirements')
          PY
