# ci-build.yml — GitHub Actions build for Blount Phone (branded linphone-iphone 6.2 fork)
#
# LAYOUT ASSUMPTION: this file runs from the FORK repo where the linphone-iphone
# release/6.2 tree is the checkout root and phone-app/ sits alongside it:
#     <repo>/LinphoneApp.xcodeproj
#     <repo>/Linphone/...
#     <repo>/phone-app/{rebrand.sh, corecontext-shim.patch, ...}
# If the fork vendors the source in a subdir instead, set LINPHONE_DIR to it.
#
# JOBS:
#   build-unsigned  — WORKS NOW, no A4 dependency. Rebrand + patch + SPM resolve +
#                     `xcodebuild build CODE_SIGNING_ALLOWED=NO`. Proves the fork
#                     compiles on every push.
#   archive-signed  — BLOCKED ON A4 (VoIP Services cert + App IDs/profiles or an
#                     App Store Connect API key). Produces a signed .xcarchive +
#                     .ipa artifact. Gate: repo variable A4_SIGNING_READY=true
#                     flips it on (see the `if:` on the job).
#
# SECRETS (repo Settings > Secrets > Actions):
#   PBX_SHIM_TOKEN              — shared secret with pbx-push-shim.service
#                                 (/etc/pbx-push-shim.env SHIM_TOKEN on pbx-wazo-01)
#   APPSTORE_CONNECT_KEY_ID     — ASC API key (role: App Manager / "Certificates,
#   APPSTORE_CONNECT_ISSUER_ID    Identifiers & Profiles" access) for automatic
#   APPSTORE_CONNECT_PRIVATE_KEY  signing + TestFlight upload (p8, base64)
#   ALT: manual signing instead — APPLE_SIGNING_CERT_P12 (base64 .p12 of the
#   Apple Distribution cert), APPLE_SIGNING_CERT_PASSWORD, and four
#   PROVISIONING_PROFILE_{APP,MSG,SHARE,INTENTS} base64 .mobileprovision files
#   (see commented block at the bottom of the archive job).

name: Blount Phone CI
on:
  workflow_dispatch:
  pull_request:
    branches: [release/6.2-blount]
  push:
    branches: [release/6.2-blount]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LINPHONE_DIR: .
  SCHEME: Linphone                     # shared scheme that builds the LinphoneApp target
  PROJECT: LinphoneApp.xcodeproj
  TEAM_ID: S77XPPF572

jobs:
  # ---------------------------------------------------------------- unsigned --
  build-unsigned:
    name: Build (unsigned) — rebrand + patch + compile
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16+
        run: |
          # pick the highest-versioned Xcode_*.app (no sort -V on macOS runners)
          XV=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sed 's|.*/Xcode_||;s|\.app$||' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
          XC="/Applications/Xcode_${XV}.app"; [ -d "$XC" ] || XC=/Applications/Xcode.app
          echo "Using $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Rebrand to net.blount.phone
        run: bash "$LINPHONE_DIR/phone-app/rebrand.sh" "$LINPHONE_DIR"

      - name: Apply CoreContext shim patch
        run: git apply --verbose "$LINPHONE_DIR/phone-app/corecontext-shim.patch"

      - name: Resolve Swift packages (github mirror, pinned 5.5.36)
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$LINPHONE_DIR/$PROJECT" -scheme "$SCHEME"

      - name: Build (no signing)
        run: |
          xcodebuild build \
            -project "$LINPHONE_DIR/$PROJECT" -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath derivedData \
            CODE_SIGNING_ALLOWED=NO \
            PBX_SHIM_URL="http://192.168.200.158:8777" \
            PBX_SHIM_TOKEN=""

  # ------------------------------------------------------------------ signed --
  archive-signed:
    name: Archive (signed) — needs A4 cert/profiles + PBX_SHIM_TOKEN
    runs-on: macos-latest
    needs: build-unsigned
    # Flip `A4_SIGNING_READY` repo variable to 'true' once the VoIP Services
    # cert + ASC API key secrets exist (plan atom A4). Until then the unsigned
    # job above is the live check.
    if: ${{ vars.A4_SIGNING_READY == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16+
        run: |
          XV=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sed 's|.*/Xcode_||;s|\.app$||' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
          XC="/Applications/Xcode_${XV}.app"; [ -d "$XC" ] || XC=/Applications/Xcode.app
          echo "Using $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Rebrand to net.blount.phone
        run: bash "$LINPHONE_DIR/phone-app/rebrand.sh" "$LINPHONE_DIR"

      - name: Apply CoreContext shim patch
        run: git apply --verbose "$LINPHONE_DIR/phone-app/corecontext-shim.patch"

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$LINPHONE_DIR/$PROJECT" -scheme "$SCHEME"

      - name: Verify Release signing settings
        run: python3 "$LINPHONE_DIR/phone-app/verify-release-signing.py"

      - name: Install App Store Connect API key
        env:
          ASC_KEY_B64: ${{ secrets.APPSTORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.private_keys
          echo "$ASC_KEY_B64" | base64 -d > ~/.private_keys/AuthKey_${{ secrets.APPSTORE_CONNECT_KEY_ID }}.p8
          chmod 600 ~/.private_keys/AuthKey_*.p8

      # Manual signing: the team has no registered devices, so automatic
      # development-profile resolution can't work. Import the Apple
      # Distribution p12 into a temp keychain + install the 4 App Store
      # profiles (created via ASC API, named "BlountDist <bundle-id>").
      - name: Install signing assets
        env:
          DIST_P12: ${{ secrets.DIST_P12 }}
          PROFILE_MAIN: ${{ secrets.PROFILE_MAIN }}
          PROFILE_MSG: ${{ secrets.PROFILE_MSG }}
          PROFILE_EXT: ${{ secrets.PROFILE_EXT }}
          PROFILE_INTENTS: ${{ secrets.PROFILE_INTENTS }}
        run: |
          KEYCHAIN=build.keychain; KCP=ci
          security create-keychain -p "$KCP" $KEYCHAIN
          security set-keychain-settings -lut 21600 $KEYCHAIN
          security unlock-keychain -p "$KCP" $KEYCHAIN
          echo "$DIST_P12" | base64 -d > dist.p12
          security import dist.p12 -k $KEYCHAIN -P "${{ secrets.DIST_P12_PASSWORD }}" \
            -T /usr/bin/codesign -T /usr/bin/security && rm dist.p12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCP" $KEYCHAIN
          security list-keychains -d user -s $KEYCHAIN $(security list-keychains -d user | tr -d '"')
          PP=~/Library/Developer/Xcode/UserData/Provisioning\ Profiles
          PP_LEGACY=~/Library/MobileDevice/Provisioning\ Profiles
          mkdir -p "$PP" "$PP_LEGACY"
          for v in PROFILE_MAIN PROFILE_MSG PROFILE_EXT PROFILE_INTENTS; do
            tmp=$(mktemp)
            echo "${!v}" | base64 -d > "$tmp"
            uuid=$(security cms -D -i "$tmp" | python3 -c 'import plistlib,sys; print(plistlib.loads(sys.stdin.buffer.read())["UUID"])')
            mv "$tmp" "$PP/$uuid.mobileprovision"
            cp "$PP/$uuid.mobileprovision" "$PP_LEGACY/$uuid.mobileprovision"
            printf '%s\n' "$PP/$uuid.mobileprovision" >> installed-profiles.txt
            printf '%s\n' "$PP_LEGACY/$uuid.mobileprovision" >> installed-profiles.txt
          done
          ls "$PP" | wc -l

      - name: Archive
        env:
          PBX_SHIM_TOKEN: ${{ secrets.PBX_SHIM_TOKEN }}
        run: |
          xcodebuild archive \
            -project "$LINPHONE_DIR/$PROJECT" -scheme "$SCHEME" \
            -configuration Release \
            -archivePath build/BlountPhone.xcarchive \
            -destination 'generic/platform=iOS' \
            -allowProvisioningUpdates \
            -authenticationKeyID "${{ secrets.APPSTORE_CONNECT_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}" \
            -authenticationKeyPath ~/.private_keys/AuthKey_${{ secrets.APPSTORE_CONNECT_KEY_ID }}.p8 \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            PBX_SHIM_URL="http://192.168.200.158:8777" \
            PBX_SHIM_TOKEN="$PBX_SHIM_TOKEN"

      # Archive is unsigned; the export re-signs all 4 targets with the
      # BlountDist profiles + Apple Distribution cert (installed above).
      - name: Export IPA (app-store-connect method → TestFlight)
        run: |
          cat > exportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>S77XPPF572</string>
            <key>uploadSymbols</key><true/>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict>
              <key>net.blount.phone</key><string>BlountDist net.blount.phone</string>
              <key>net.blount.phone.msgNotificationService</key><string>BlountDist net.blount.phone.msgNotificationService</string>
              <key>net.blount.phone.linphoneExtension</key><string>BlountDist net.blount.phone.linphoneExtension</string>
              <key>net.blount.phone.intentsExtension</key><string>BlountDist net.blount.phone.intentsExtension</string>
            </dict>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/BlountPhone.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist exportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyID "${{ secrets.APPSTORE_CONNECT_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}" \
            -authenticationKeyPath ~/.private_keys/AuthKey_${{ secrets.APPSTORE_CONNECT_KEY_ID }}.p8

      - name: Verify exported app group entitlement
        run: python3 "$LINPHONE_DIR/phone-app/verify-exported-entitlements.py" build/ipa/*.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: BlountPhone-ipa
          path: build/ipa/*.ipa

      # Straight to TestFlight — internal testers only, skips beta review.
      # App record: ASC id 6826540875 "Blount Phone" (net.blount.phone).
      - name: Upload to TestFlight
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/release/6.2-blount' }}
        run: |
          xcrun altool --upload-app -f build/ipa/*.ipa -t ios \
            --apiKey "${{ secrets.APPSTORE_CONNECT_KEY_ID }}" \
            --apiIssuer "${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}" \
            --verbose

      - name: Cleanup signing assets
        if: always()
        run: |
          rm -f dist.p12
          security delete-keychain build.keychain 2>/dev/null || true
          if [ -f installed-profiles.txt ]; then
            while IFS= read -r profile; do rm -f "$profile"; done < installed-profiles.txt
            rm -f installed-profiles.txt
          fi

# MANUAL-SIGNING ALTERNATIVE (if ASC API key isn't available): import the
# distribution cert into a temp keychain + drop 4 .mobileprovision files into
# ~/Library/MobileDevice/Provisioning Profiles/, then archive with
#   CODE_SIGN_STYLE=Manual
#   and per-target specifiers via a small xcconfig override file:
#     PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*] handled per-target —
# simplest is generating a Profiles.xcconfig that maps each target's profile
# UUID, or pre-setting profiles in the project. Prefer the ASC-key path; it
# lets Xcode create/manage the 4 profiles itself once the App IDs exist.
